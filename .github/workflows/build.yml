name: Build MTerm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --exclude-tags golden

      - name: Prepare signing key
        env:
          MTERM_KEY_PASS: ${{ secrets.MTERM_KEY_PASS }}
        run: |
          MTERM_KEY_PASS="$(printf '%s' "$MTERM_KEY_PASS" | tr -d ' \r\n\t')"
          export MTERM_KEY_PASS
          echo "key length: ${#MTERM_KEY_PASS}, hash: $(printf '%s' "$MTERM_KEY_PASS" | sha256sum | cut -c1-8)"
          if [ -z "$MTERM_KEY_PASS" ]; then echo "::error::Secret MTERM_KEY_PASS is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/mterm-release.jks.enc -out android/app/mterm-release.jks -pass env:MTERM_KEY_PASS
          printf "storeFile=mterm-release.jks\nstorePassword=%s\nkeyAlias=mterm\nkeyPassword=%s\n" "$MTERM_KEY_PASS" "$MTERM_KEY_PASS" > android/key.properties

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk MTerm-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MTerm-apk
          path: MTerm-v1.0.${{ github.run_number }}.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MTerm-v1.0.${{ github.run_number }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MTerm-windows
          path: MTerm-v1.0.${{ github.run_number }}-windows-x64.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MTerm-v1.0.${{ github.run_number }}-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MTerm-ios
          path: MTerm-v1.0.${{ github.run_number }}-ios-unsigned.ipa

  release:
    needs: [build, windows, ios]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MTerm v1.0.${{ github.run_number }}
          files: dist/*
          make_latest: true
          repository: mojix4/mterm-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          target_commitish: main
