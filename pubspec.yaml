name: mterm
description: MTerm - a fast, minimal SSH terminal for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^2.11.0
  xterm: ^4.0.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  wakelock_plus: ^1.2.8
  crypto: ^3.0.3
  url_launcher: ^6.3.3
  file_picker: ^11.0.3
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
